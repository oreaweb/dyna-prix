<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#26364f"><title>Dyna Stats — Statistiques</title><style>html,body{margin:0;min-height:100%;background:#eaf0f7;font-family:Arial,sans-serif}#ds-launch{display:none!important}#ds-panel{max-width:760px!important;inset:12px auto 12px 50%!important;box-shadow:0 8px 35px #0002!important}@media(max-width:600px){#ds-panel{inset:0 auto 0 50%!important;width:100%!important;border-radius:0!important}}#ds-panel{max-width:1000px!important} .ds-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.ds-kpi{background:#f2f6fb;padding:16px;border-radius:14px;border:1px solid #e2eaf4}.ds-kpi small{color:#627086}.ds-kpi strong{display:block;font-size:27px;margin:7px 0}.ds-kpi em{font-size:12px;font-style:normal;color:#627086}.ds-section{margin-top:23px}.ds-section h3{margin:0 0 12px}.ds-chart{display:flex;align-items:end;gap:5px;height:165px;border-bottom:1px solid #d7e0ec;padding:10px 0 0}.ds-day{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:3px}.ds-stack{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;justify-content:flex-start;border-radius:5px 5px 0 0;overflow:hidden}.ds-segment{width:100%;min-height:0}.ds-day-label{font-size:10px;color:#657184;white-space:nowrap}.ds-line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #e8edf3}.ds-pill{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}.ds-columns{display:grid;grid-template-columns:1fr 1fr;gap:22px}.ds-meter{height:10px;background:#e8edf3;border-radius:9px;overflow:hidden;display:flex}.ds-meter span{height:100%}.ds-muted{color:#69778a;font-size:12px;line-height:1.5}.ds-note{background:#f6f8fb;border-radius:9px;padding:12px}.ds-up{color:#137d58!important}.ds-down{color:#a85032!important}@media(max-width:700px){.ds-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.ds-columns{grid-template-columns:1fr}.ds-kpi{padding:12px}.ds-kpi strong{font-size:24px}} </style></head><body><script>
(async function(){
  const status=document.createElement("p");
  status.id="loading";status.style.cssText="font:14px Arial,sans-serif;color:#657184;text-align:center;margin:15vh auto";
  status.textContent="Chargement de Dyna Stats…";document.body.appendChild(status);
  try{
    const response=await fetch("./app.js?fresh="+Date.now(),{cache:"no-store"});
    if(!response.ok)throw Error("HTTP "+response.status);
    const code=await response.text();
    if(!code.includes('const VERSION='))throw Error("Fichier de programme invalide");
    status.remove();
    const script=document.createElement("script");
    script.textContent=code+"\n//# sourceURL=dyna-stats-app.js";
    document.body.appendChild(script);
  }catch(error){
    status.textContent="Impossible de charger Dyna Stats : "+error.message+".";
    const retry=document.createElement("button");retry.textContent="Réessayer";retry.style.cssText="display:block;margin:15px auto;padding:10px 20px";retry.onclick=()=>location.reload();document.body.appendChild(retry);
  }
})();
</script></body></html>
